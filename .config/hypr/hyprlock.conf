# HyprZen — Beautiful Hyprlock Config
source = ~/.config/hypr/themes/current_theme.conf

general {
    disable_loading_bar   = true
    grace                 = 0
    hide_cursor           = true
    no_fade_in            = false
    no_fade_out           = false
    ignore_empty_input    = true
}

# ── Background ────────────────────────────────────────────────
background {
    monitor     =
    path        = /home/zen/Desktop/hyprzen/wallpapers/current
    blur_passes = 2
    blur_size   = 6
    brightness  = 0.5
    contrast    = 0.9
    vibrancy    = 0.2
    vibrancy_darkness = 0.2
}

# ── Clock ─────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = rgb($text)
    font_size = 130
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 5
    position = 0, 200
    halign = center
    valign = center
}

# ── Date ──────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B %Y')" </b>"
    color = rgb($subtext)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 3
    position = 0, 80
    halign = center
    valign = center
}

# ── Profile Picture ───────────────────────────────────────────
image {
    monitor =
    path = /home/zen/.face
    size = 110
    rounding = -1
    border_size = 4
    border_color = rgb($primary)
    position = 0, -40
    halign = center
    valign = center
}

# ── Input field ───────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.4)
    font_color = rgb($text)
    fade_on_empty = false
    placeholder_text = <span foreground="##$subtext"><i>󰌾  Logged in as </i><span foreground="##$primary">$USER</span></span>
    hide_input = false
    rounding = -1
    check_color = rgb($primary)
    fail_color = rgb($error)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb($primary)
    position = 0, -160
    halign = center
    valign = center
}
